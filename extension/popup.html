<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #faf9f6;
        --surface: #ffffff;
        --primary: #000000;
        --border: #e5e5e5;
        --text: #000000;
        --muted: #666666;
        --success: #10b981;
        --error: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .header-actions {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }

      .header-btn {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        color: var(--muted);
      }

      .header-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: #f5f5f5;
      }

      .header-btn:active {
        transform: scale(0.95);
      }

      .header-btn.success {
        border-color: var(--success);
        color: var(--success);
        background: #ecfdf5;
      }

      .header-btn svg {
        width: 14px;
        height: 14px;
      }

      .logo {
        width: 28px;
        height: 28px;
        background: var(--primary);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 11px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
      }

      .form {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field label {
        font-size: 10px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
        background: var(--surface);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);
      }

      .field textarea {
        resize: none;
        height: 60px;
        line-height: 1.4;
      }

      .row {
        display: flex;
        gap: 8px;
      }
      .row .field {
        flex: 1;
      }

      .profiles {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px 0;
        min-height: 28px;
        align-items: center;
      }
      .profiles::-webkit-scrollbar {
        display: none;
      }

      .profile {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 8px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--surface);
        cursor: pointer;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .profile:hover {
        border-color: #ccc;
      }
      .profile.selected {
        border-color: var(--primary);
        background: var(--primary);
        color: white;
      }
      .profile .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        font-size: 8px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .profile.selected .dot {
        background: white !important;
        color: var(--primary);
      }
      .profile span {
        font-size: 11px;
        font-weight: 500;
      }

      button#addBtn {
        width: 100%;
        padding: 10px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        margin-top: 4px;
      }
      button#addBtn:hover {
        background: #1a1a1a;
      }
      button#addBtn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      #status {
        font-size: 11px;
        font-weight: 500;
        text-align: center;
        padding: 0 14px 12px;
        min-height: 18px;
      }

      .error {
        color: var(--error);
      }
      .success {
        color: var(--success);
      }
      .loading {
        color: var(--muted);
      }
      .warning {
        color: var(--warning);
      }

      input::placeholder,
      textarea::placeholder {
        color: #999;
      }
      input[type="hidden"] {
        display: none;
      }

      .server-config {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 0 14px 4px;
        font-size: 10px;
      }
      .server-config input {
        flex: 1;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 10px;
        background: var(--surface);
      }
      .server-config .connected {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .server-config .connected.online {
        background: var(--success);
      }
      .server-config .connected.offline {
        background: var(--error);
      }

      .checkbox-field {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
        cursor: pointer;
        user-select: none;
      }
      .checkbox-field input {
        width: 14px !important;
        height: 14px !important;
        cursor: pointer;
      }
      .checkbox-field label {
        font-size: 11px !important;
        font-weight: 500 !important;
        color: var(--text) !important;
        text-transform: none !important;
        letter-spacing: normal !important;
        cursor: pointer;
      }

      .open-batch {
        display: block;
        width: calc(100% - 28px);
        margin: 0 14px 8px;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
        text-align: center;
        color: var(--muted);
        transition: all 0.15s;
      }
      .open-batch:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">RT</div>
      <h1>Resume Tailor</h1>
      <div class="header-actions">
        <button id="copyBtn" class="header-btn" title="Copy Company & Website">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <button id="pasteBtn" class="header-btn" title="Paste Company & Website">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            ></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
        </button>
      </div>
    </div>

    <div class="server-config">
      <div id="connectionDot" class="connected offline"></div>
      <input type="text" id="serverUrl" placeholder="Server URL (e.g. http://localhost:3000)" />
    </div>

    <div class="form">
      <div class="field">
        <label>Profile</label>
        <div id="profileContainer" class="profiles">
          <!-- Profiles loaded dynamically -->
        </div>
        <input type="hidden" id="profileId" value="" />
      </div>

      <div class="row">
        <div class="field">
          <label>Company</label>
          <input type="text" id="companyName" placeholder="Company name" />
        </div>
        <div class="field">
          <label>Position</label>
          <input type="text" id="positionTitle" placeholder="Job title" />
        </div>
      </div>

      <div class="field">
        <label>Job Posting URL</label>
        <input type="text" id="jobUrl" placeholder="https://..." />
      </div>

      <div class="field">
        <label>Company Website (for research)</label>
        <input type="text" id="companyUrl" placeholder="https://company.com" />
      </div>

      <div class="field">
        <label>Job Description</label>
        <textarea id="jobDescription" placeholder="Paste or select text on page..."></textarea>
      </div>

      <input type="hidden" id="personalDetails" value="" />

      <div class="checkbox-field">
        <input type="checkbox" id="includeCoverLetter" />
        <label for="includeCoverLetter">Include Cover Letter</label>
      </div>

      <button id="addBtn">Add to Queue</button>
    </div>

    <button id="openBatchBtn" class="open-batch">Open Batch Mode →</button>

    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
