<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg: #ffffff;
        --surface: #f8fafc;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --error: #ef4444;
        --success: #10b981;
        --radius: 8px;
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .header {
        padding: 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 24px;
        height: 24px;
        background: var(--primary);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
      }

      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }

      #form {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        transition: all 0.2s;
      }

      textarea {
        resize: vertical;
        min-height: 80px;
        line-height: 1.5;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      input::placeholder,
      textarea::placeholder {
        color: #94a3b8;
      }

      /* Profile Selector */
      .profile-container {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .profile-container::-webkit-scrollbar {
        display: none;
      }

      .profile-item {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        opacity: 0.6;
        transition: all 0.2s;
        width: 60px;
      }

      .profile-item:hover {
        opacity: 0.8;
      }

      .profile-item.selected {
        opacity: 1;
      }

      .profile-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: white;
        font-size: 14px;
        border: 2px solid transparent;
        transition: all 0.2s;
      }

      .profile-item.selected .profile-avatar {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        transform: scale(1.05);
      }

      .profile-name {
        font-size: 10px;
        font-weight: 500;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }

      button#addBtn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: var(--radius);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
      }

      button#addBtn:hover {
        background: var(--primary-hover);
      }

      button#addBtn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      #status {
        font-size: 12px;
        text-align: center;
        min-height: 20px;
        padding: 0 16px 16px;
        font-weight: 500;
      }

      .error {
        color: var(--error);
      }
      .success {
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">RT</div>
      <h2>Resume Tailor</h2>
    </div>

    <div id="form">
      <div class="form-group">
        <label>Select Profile</label>
        <div id="profileContainer" class="profile-container">
          <!-- Profiles will be injected here -->
          <div class="profile-item selected" data-id="">
            <div class="profile-avatar" style="background: #64748b">D</div>
            <span class="profile-name">Default</span>
          </div>
        </div>
        <input type="hidden" id="profileId" value="" />
      </div>

      <div class="form-group">
        <label>Company</label>
        <input type="text" id="companyName" placeholder="e.g. Google" />
      </div>

      <div class="form-group">
        <label>Position</label>
        <input
          type="text"
          id="positionTitle"
          placeholder="e.g. Senior Engineer"
        />
      </div>

      <div class="form-group">
        <label>Job URL</label>
        <input type="text" id="companyUrl" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label>Job Description</label>
        <textarea
          id="jobDescription"
          placeholder="Paste description or select text on page..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Notes (Optional)</label>
        <textarea
          id="personalDetails"
          style="min-height: 50px"
          placeholder="Specific notes for this application..."
        ></textarea>
      </div>

      <button id="addBtn">Add to Queue</button>
    </div>

    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
